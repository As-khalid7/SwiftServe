<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إعادة تعيين كلمة المرور | Future Technology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="mono" style="width:50px;height:50px;">
      <svg viewBox="0 0 40 40" style="width:26px;height:26px">
        <path d="M6 8 H24 M6 8 V32 M6 19 H19" stroke="#FFFFFF" stroke-width="4.4" fill="none" stroke-linecap="square"/>
        <path d="M20 8 L34 8 L26 16" stroke="#D4AF37" stroke-width="4" fill="none" stroke-linecap="square"/>
        <path d="M22 24 H34 M28 24 V32" stroke="#14B8A6" stroke-width="4.4" fill="none" stroke-linecap="square"/>
      </svg>
    </div>
    <h1>إعادة تعيين كلمة المرور</h1>

    <div id="resetFormWrap">
      <p class="hint">أدخل كلمة المرور الجديدة لحسابك.</p>
      <form id="resetForm">
        <div class="field">
          <label for="password">كلمة المرور الجديدة</label>
          <input type="password" id="password" required minlength="8" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="password2">تأكيد كلمة المرور</label>
          <input type="password" id="password2" required minlength="8" autocomplete="new-password">
        </div>
        <div id="formMsg" class="form-msg"></div>
        <button type="submit" class="btn btn-primary">حفظ كلمة المرور الجديدة</button>
      </form>
    </div>

    <div id="resetInvalid" style="display:none;">
      <p class="hint">هذا الرابط غير صالح أو ناقص. اطلب رابطاً جديداً من صفحة نسيت كلمة المرور.</p>
    </div>

    <div class="auth-links">
      <div><a href="/forgot-password.html">طلب رابط جديد</a></div>
      <div style="margin-top:10px;"><a href="/login.html">← رجوع لتسجيل الدخول</a></div>
    </div>
  </div>
</div>
<script src="/js/auth-pages.js"></script>
</body>
</html>
