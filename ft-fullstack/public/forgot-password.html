<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نسيت كلمة المرور | Future Technology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="mono" style="width:50px;height:50px;">
      <svg viewBox="0 0 40 40" style="width:26px;height:26px">
        <path d="M6 8 H24 M6 8 V32 M6 19 H19" stroke="#FFFFFF" stroke-width="4.4" fill="none" stroke-linecap="square"/>
        <path d="M20 8 L34 8 L26 16" stroke="#D4AF37" stroke-width="4" fill="none" stroke-linecap="square"/>
        <path d="M22 24 H34 M28 24 V32" stroke="#14B8A6" stroke-width="4.4" fill="none" stroke-linecap="square"/>
      </svg>
    </div>
    <h1>نسيت كلمة المرور؟</h1>
    <p class="hint">أدخل بريدك الإلكتروني وبنرسل لك رابط إعادة تعيين كلمة المرور.</p>

    <form id="forgotForm">
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div id="formMsg" class="form-msg"></div>
      <button type="submit" class="btn btn-primary">إرسال رابط إعادة التعيين</button>
    </form>

    <div class="auth-links">
      <div><a href="/login.html">← رجوع لتسجيل الدخول</a></div>
    </div>
  </div>
</div>
<script src="/js/auth-pages.js"></script>
</body>
</html>
